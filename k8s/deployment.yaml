apiVersion: apps/v1

kind: Deployment

metadata:
  name: nginx

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx

  template:

    metadata:
      labels:
        app: nginx

    spec:

      containers:

      - name: nginx

        image: nginx-demo:latest

        imagePullPolicy: Never

        ports:

        - containerPort: 80
