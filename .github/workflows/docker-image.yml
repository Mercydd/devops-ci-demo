name: Docker CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: mercydd/devops-ci-demo
  GITOPS_REPO: Mercydd/devops-ci-demo-gitops

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }} \
            -f docker/Dockerfile .

      - name: Start container
        run: |
          docker run -d \
            --name nginx-test \
            -p 80:80 \
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}

      - name: Validate nginx configuration
        run: |
          docker exec nginx-test nginx -t

      - name: Check index.html exists
        run: |
          docker exec nginx-test \
            test -f /usr/share/nginx/html/index.html

      - name: Check website response
        run: |
          curl --fail http://localhost:80

      - name: Show nginx version
        run: |
          docker exec nginx-test nginx -v

      - name: Stop container
        if: always()
        run: |
          docker stop nginx-test || true
          docker rm nginx-test || true

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push \
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}

      - name: Checkout GitOps repository
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update image tag in GitOps repository
        if: github.event_name == 'push'
        run: |
          cd gitops

          sed -i \
            "s|image: mercydd/devops-ci-demo:.*|image: mercydd/devops-ci-demo:${{ steps.vars.outputs.sha_short }}|" \
            manifests/deployment.yaml

          git diff

      - name: Commit and push GitOps change
        if: github.event_name == 'push'
        run: |
          cd gitops

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifests/deployment.yaml

          git commit \
            -m "Update nginx image to ${{ steps.vars.outputs.sha_short }}"

          git push
